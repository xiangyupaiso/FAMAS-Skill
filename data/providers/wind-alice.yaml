  recommended: "宿主客户端连接器授权：用户登录数据源方账号（唯一人工步骤）"
  token_location: "宿主客户端保管并自动刷新，本仓库不存放"
  note: "FAMAS 无账号、无登录入口；登录对象是数据源的 MCP，不是 FAMAS"


# 同一连接器提供两类来源，可信度必须分别取：
#   公告 / 基金定期报告 / 招募说明书原文片段 -> L1（一手披露文件）
#   结构化接口（档案、业绩、持仓、财务、持有人、指数快照）-> L2（持牌数据商）
# 选源规则见 data/gateway.md 第三节「混合可信度 provider」。
trust_by_source_type:
  disclosure_original: L1
  structured_api: L2


# 全市场筛选、基金公司档案、宏观 EDB「仅搜索/仅提数」通道均已实测可用。
supplementary_probe:
  fund_nav_history: "2026-10-01→2026-11-06 共 22 个交易日单位/累计/复权净值，单位净值=累计净值=复权净值（无分红迹象）"
  fund_universe: "search_funds 组合条件筛选返回 5 只，含目标基金规模 189.3266 亿元，与持有人接口一致"
  fund_company: "管理人规模 2.8403 万亿元、非货币 1.9981 万亿元、旗下 557 只；『基金经理数量 75752 个』量级异常 -> implausible_value"
  macro_edb: "仅搜索可定位指标（如 CPI 当月同比 M0000612）；仅提数 CPI 可用；10 年国债收益率 S0059749 返回 code 1008 指标级无权限"
  news: "财经新闻检索返回券商研报摘录（机构名/发布时间/分析师编号），按 L3 二手处理，仅作 opinion_ref"


  dividend_history: "分红总额返回 null，无法区分无分红与无数据"
  macro_rates: "EDB 通道可用但本账号缺利率类指标权限，属账号授权范围问题，非工具不支持"
  research_reports: "新闻检索可得研报观点片段，非研报全文；second_hand，需核实原文"
